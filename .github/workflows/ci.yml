name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:                    # reusable by release.yml as a gate

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Cyrius toolchain
        # Delegates to the UPSTREAM INSTALLER rather than unpacking the
        # release tarball by hand (the shape patra's CI uses).
        #
        # ⛔ The hand-rolled version this replaces copied the tarball into a
        # flat `~/.cyrius/{bin,lib}` — the pre-`versions/` layout the
        # toolchain abandoned. `cyrius deps` resolves a dep's sidecar stdlib
        # leaves out of the VERSION-PINNED SNAPSHOT, so every run died one
        # step later with:
        #
        #   error: cyrius.cyml pins version 6.5.35 but it is not installed
        #     at $HOME/.cyrius/versions/6.5.35/lib
        #
        # install.sh lays out `versions/<v>/{bin,lib,programs}`, writes
        # `current`, and points `~/.cyrius/{bin,lib}` at the active version.
        # It also verifies the tarball checksum and signature; the hand-rolled
        # `curl -sLO` did neither.
        #
        # CLAUDE.md § CI/Release: `[package].cyrius` in cyrius.cyml is the ONLY
        # source of truth for the toolchain version — nothing is hardcoded
        # here. The installer is fetched from that same TAG rather than from
        # `main`: an immutable ref, and install.sh carries the release signing
        # pubkey for exactly the version it installs (its CVE-13 note).
        run: |
          set -e
          CYRIUS_VERSION="$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')"
          [ -n "$CYRIUS_VERSION" ] \
            || { echo "::error::could not read [package].cyrius from cyrius.cyml"; exit 1; }
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sSfL "https://raw.githubusercontent.com/MacCracken/cyrius/${CYRIUS_VERSION}/scripts/install.sh" \
            | CYRIUS_VERSION="$CYRIUS_VERSION" sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"
          echo "CYRIUS_HOME=$HOME/.cyrius" >> "$GITHUB_ENV"

      - name: Verify toolchain layout
        # Assert the pinned snapshot exists BEFORE anything depends on it, so
        # a packaging or installer regression fails here with a direct message
        # instead of surfacing as a confusing `cyrius deps` error two steps on
        # — which is exactly how the flat-layout break presented.
        run: |
          CYRIUS_VERSION="$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')"
          cyrius version
          test -d "$HOME/.cyrius/versions/$CYRIUS_VERSION/lib" || {
            echo "::error::stdlib snapshot missing at ~/.cyrius/versions/$CYRIUS_VERSION/lib"
            exit 1
          }
          echo "snapshot OK: $(ls "$HOME/.cyrius/versions/$CYRIUS_VERSION/lib" | wc -l) modules"

      - name: Resolve dependencies
        # Fetches vyakarana / cyim-lsp / darshana from the tags pinned in
        # cyrius.cyml ([deps.NAME] git + tag + modules) into lib/, and
        # resolves each bundle's stdlib leaves against the pinned snapshot.
        run: cyrius deps

      - name: Format check
        # Per-file loop, deliberately NOT `cyrfmt --check src/*.cyr`: cyrfmt
        # reads only argv[1] and silently ignores the rest, so the glob form
        # checks the first entry and exits 0 (patra's CI carries the same
        # warning; libro sat green over five unformatted files that way).
        #
        # cyim had NO format gate until 1.8.2, which is how three files
        # drifted unnoticed when cyrius 6.5.28 gave cyrfmt the parenthesis
        # tracking it never had. `src/plugins/` is included — it is where one
        # of the three lived.
        run: |
          fail=0
          for f in src/*.cyr src/plugins/*.cyr tests/*.tcyr tests/*.bcyr fuzz/*.fcyr; do
            [ -e "$f" ] || continue
            cyrfmt --check "$f" >/dev/null 2>&1 || { echo "unformatted: $f"; fail=1; }
          done
          [ $fail -eq 0 ] || { echo "format: run 'cyrius fmt <file>' on the files above"; exit 1; }
          echo "format: all source, test and fuzz files formatted"

      - name: Build
        run: |
          mkdir -p build
          cyrius build src/main.cyr build/cyim

      - name: Verify ELF
        run: xxd -l 4 build/cyim | grep -q "7f45 4c46"

      - name: Lint
        # Every src file clean; the only tolerated warning is the
        # `exceeds 120 characters` rule on comment-divider lines
        # (cosmetic only). Anything else is a hard fail.
        #
        # cyrius lint exits non-zero when it has anything to report
        # (even "0 warnings"), so both the tool invocation and the
        # inner grep (which exits 1 on no match) need `|| true` to
        # avoid colliding with the implicit `set -e` on `run:`.
        #
        # 1.8.2: `src/plugins/*.cyr` added. It had never been linted, and it
        # is a third of the LSP consumer surface.
        run: |
          fail=0
          for f in src/*.cyr src/plugins/*.cyr; do
            [ -e "$f" ] || continue
            out=$(cyrius lint "$f" 2>&1 || true)
            echo "$out"
            bad=$(echo "$out" | grep -E '^\s*warn ' | grep -v 'exceeds 120 characters' || true)
            if [ -n "$bad" ]; then
              fail=1
            fi
          done
          [ $fail -eq 0 ] || { echo "lint: non-cosmetic warnings present"; exit 1; }

      - name: Test
        # Bare `cyrius test` picks up the [build].test entry AND
        # auto-discovers tests/*.tcyr (cc5 v5.6.28+).
        run: cyrius test

      - name: Fuzz
        # Runs every fuzz/*.fcyr harness. Each is bounded
        # (10K iters in buffer.fcyr, 100×1KB in tokenizer.fcyr,
        # 5K iters in driver.fcyr) so the job stays under a minute.
        run: cyrius fuzz

      - name: Benchmark (smoke run)
        # Just confirms tests/perf.bcyr still compiles and produces
        # numbers. The perf-tracking discipline lives in
        # BENCHMARKS.md, not CI — this step exists so a syntax
        # break in the bench harness doesn't go unnoticed.
        run: cyrius bench tests/perf.bcyr

      - name: CLI smoke
        # tests/cli_smoke.sh drives the six one-shot agent verbs
        # (--write / --replace[-all] / --grep / --batch / --headless) and
        # every modifier, asserting exit codes and on-disk results. 118
        # assertions covering the `daimon` consumer surface — the contract
        # CLAUDE.md § Consumers commits to. It had never been a CI step, so
        # the agent-facing half of cyim was ungated until 1.8.2.
        run: bash tests/cli_smoke.sh

      - name: PTY integration smoke
        # tests/integration_smoke.py spawns the cyim binary under a
        # real PTY (via pty.fork) and drives recorded keystroke
        # sequences end-to-end. Covers M1–M4 behavior (search +
        # undo + dot + visual + multi-window + highlight).
        run: python3 tests/integration_smoke.py

      - name: DCE parity check
        # A release build and a debug build must produce the same
        # behavior. Rebuild with CYRIUS_DCE=1 and re-run integration smoke.
        run: |
          mkdir -p build
          CYRIUS_DCE=1 cyrius build src/main.cyr build/cyim-dce
          echo "cyim-dce: $(wc -c < build/cyim-dce) bytes"
          # Replace the regular binary so integration_smoke.py picks up the DCE build.
          cp build/cyim-dce build/cyim
          python3 tests/integration_smoke.py

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for dangerous patterns in src/
        # Encodes the invariants closed by the M5/M6/M7 audit
        # findings. Rejects pattern hits in code; tolerates them
        # in comments. GitHub Actions runs bash with `set -eo
        # pipefail`, so every `grep | awk` pipeline where grep may
        # find no matches needs `|| true` to stay alive on "clean".
        run: |
          FAIL=0
          scan() {
            local label="$1"; shift
            local pat="$1"; shift
            local hits
            hits=$(grep -rn "$pat" src/ 2>/dev/null | awk -F: '
              { line=$3; for(i=4;i<=NF;i++) line=line":"$i;
                sub(/^[[:space:]]+/,"",line);
                if (substr(line,1,1) != "#") print $1":"$2":"line }' || true)
            if [ -n "$hits" ]; then
              echo "FAIL: $label"
              echo "$hits"
              FAIL=1
            fi
          }

          # Refusal §0 — no shell-out anywhere in the editor.
          # /bin/sh string MUST NOT appear in any src file.
          sh_hits=$(grep -rn '"/bin/sh"' src/ 2>/dev/null \
            | awk -F: '
              { line=$3; for(i=4;i<=NF;i++) line=line":"$i;
                sub(/^[[:space:]]+/,"",line);
                if (substr(line,1,1) != "#") print $1":"$2":"line }' || true)
          if [ -n "$sh_hits" ]; then
            echo "FAIL: /bin/sh invocation in code"
            echo "$sh_hits"
            FAIL=1
          fi

          # Same for sys_system / raw execve (59) / raw fork (57).
          scan "sys_system call"   '\bsys_system\s*('
          scan "raw execve(59)"    'syscall( *59'
          scan "raw fork(57)"      'syscall( *57'

          # M6 audit F-1 regression guard — render-side control-byte
          # substitution must remain in place. If render.cyr ever
          # loses its render_ctrl_substitute call, raw ESC bytes
          # could echo to the terminal (corpus Class 3 / 10).
          if ! grep -q 'render_ctrl_substitute' src/render.cyr; then
            echo "FAIL: render.cyr missing render_ctrl_substitute call"
            FAIL=1
          fi

          # M7 F-2 regression guard — :e file-size check.
          if ! grep -q '_cmd_file_size' src/command.cyr; then
            echo "FAIL: command.cyr missing _cmd_file_size pre-check"
            FAIL=1
          fi
          if ! grep -q 'editor_cfg_max_filesize' src/command.cyr; then
            echo "FAIL: command.cyr missing maxfilesize cap consultation"
            FAIL=1
          fi

          # M6 F-3 regression guard — cmdbuf cap.
          if ! grep -q 'COMMAND_MAX_LEN' src/command.cyr; then
            echo "FAIL: command.cyr missing COMMAND_MAX_LEN cap"
            FAIL=1
          fi

          # CLAUDE.md rule: heap-allocate large data. Flag any
          # static `var X[N]` with N >= 65536.
          awk -F: '
            /var [A-Za-z_][A-Za-z0-9_]*\[[0-9]+\]/ {
              match($0, /\[[0-9]+\]/); s=substr($0,RSTART+1,RLENGTH-2); n=s+0;
              if (n >= 65536) print FILENAME":"NR": large stack buffer ("n" bytes): "$0
            }' src/*.cyr > /tmp/bigbuf.txt
          if [ -s /tmp/bigbuf.txt ]; then
            cat /tmp/bigbuf.txt
            FAIL=1
          fi

          echo "security scan complete (fail: $FAIL)"
          exit $FAIL

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required files
        run: |
          MISSING=0
          for f in README.md CHANGELOG.md VERSION CONTRIBUTING.md SECURITY.md \
                   CODE_OF_CONDUCT.md LICENSE cyrius.cyml CLAUDE.md \
                   docs/development/roadmap.md docs/development/state.md \
                   docs/guides/usage.md docs/guides/keymap.md \
                   docs/guides/cyimrc.md docs/adr/0001-trust-model.md \
                   BENCHMARKS.md; do
            if [ -f "$f" ]; then echo "  OK: $f"
            else echo "  MISSING: $f"; MISSING=1; fi
          done
          exit $MISSING

      - name: Verify version consistency
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "VERSION file: $VERSION"
          # CHANGELOG must have a section for this version.
          grep -qE "^## \[${VERSION}\]" CHANGELOG.md \
            || { echo "FAIL: CHANGELOG.md missing section [${VERSION}]"; exit 1; }
          # cyrius.cyml pulls from VERSION via ${file:VERSION} — confirm the
          # indirection hasn't drifted to a hardcoded value.
          grep -qE '^version *= *"\$\{file:VERSION\}"' cyrius.cyml \
            || { echo "FAIL: cyrius.cyml version no longer pulls from VERSION"; exit 1; }
          # The `cyim X.Y.Z` literal lives in src/version_str.cyr (auto-
          # generated by scripts/version-bump.sh; see CLAUDE.md § Work Loop
          # step 7). print_version in src/main.cyr reads the var rather
          # than embedding the string, so this is the surface that drifts.
          grep -qE "_VERSION_STR_CYIM *= *\"cyim ${VERSION}\\\\n\"" src/version_str.cyr \
            || { echo "FAIL: src/version_str.cyr != $VERSION (run: sh scripts/version-bump.sh \"\$(cat VERSION)\")"; exit 1; }
          echo "Version consistent: VERSION = CHANGELOG = cyrius.cyml = version_str.cyr = $VERSION"
